<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AP202</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <section id="intro" class="screen">
      <div id="intro-text" aria-live="polite"></div>
      <button id="start-button" type="button">CLIQUE PARA COMEÇAR</button>
    </section>

    <section id="scene" class="screen hidden" aria-label="Cena atual">
      <img id="scene-image" src="assets/scenes/scene-01.png" alt="Uma porta metálica escura" draggable="false">
      <img id="scene-image-next" src="assets/scenes/scene-01.png" alt="" draggable="false" aria-hidden="true">

      <button id="door-handle" class="hotspot hotspot-entry hidden" type="button" aria-label="Abrir a porta de metal"></button>
      <button id="fridge-hotspot" class="hotspot hotspot-fridge hidden" type="button" aria-label="Interagir com a geladeira"></button>
      <button id="freezer-hotspot" class="hotspot hotspot-freezer hidden" type="button" aria-label="Interagir com o freezer"></button>
      <button id="bathroom-door-hotspot" class="hotspot hotspot-bathroom-door hidden" type="button" aria-label="Entrar no banheiro"></button>
      <button id="bedroom-door-hotspot" class="hotspot hotspot-bedroom-door hidden" type="button" aria-label="Entrar no quarto"></button>
      <button id="back-hotspot" class="hotspot hotspot-back hidden" type="button" aria-label="Voltar"></button>

      <button id="dresser-hotspot" class="hotspot hotspot-dresser hidden" type="button" aria-label="Examinar a cômoda"></button>
      <button id="phone-hotspot" class="hotspot hotspot-phone hidden" type="button" aria-label="Pegar o celular"></button>
      <button id="drawer-hotspot" class="hotspot hotspot-drawer hidden" type="button" aria-label="Abrir a gaveta"></button>
      <button id="key-hotspot" class="hotspot hotspot-key hidden" type="button" aria-label="Pegar a chave"></button>
      <button id="body-hotspot" class="hotspot hotspot-body hidden" type="button" aria-label="Examinar o corpo"></button>

      <div id="interaction-hint" class="interaction-hint hidden">Abrir</div>
      <div id="scene-message" class="scene-message hidden"></div>
      <div id="scene-overlay" aria-hidden="true"></div>
    </section>
  </main>

  <audio id="night-audio" preload="auto" loop src="assets/sounds/nightambient.mp3"></audio>
  <audio id="kitchen-audio" preload="auto" loop src="assets/sounds/kitchenambient.mp3"></audio>
  <audio id="flies-audio" preload="auto" loop src="assets/sounds/flies.mp3"></audio>
  <audio id="fridge-hum-audio" preload="auto" loop src="assets/sounds/fridgehum.mp3"></audio>

  <audio id="handle-audio" preload="auto" src="assets/sounds/doorhandle.mp3"></audio>
  <audio id="metal-open-audio" preload="auto" src="assets/sounds/metaldooropen.mp3"></audio>
  <audio id="wood-open-audio" preload="auto" src="assets/sounds/wooddooropen.mp3"></audio>
  <audio id="wood-close-audio" preload="auto" src="assets/sounds/wooddoorclose.mp3"></audio>
  <audio id="fridge-open-audio" preload="auto" src="assets/sounds/fridgeopen.mp3"></audio>
  <audio id="fridge-close-audio" preload="auto" src="assets/sounds/fridgeclose.mp3"></audio>
  <audio id="freezer-open-audio" preload="auto" src="assets/sounds/freezeropen.mp3"></audio>
  <audio id="freezer-close-audio" preload="auto" src="assets/sounds/freezerclose.mp3"></audio>

  <audio id="slow-steps-audio" preload="auto" src="assets/sounds/passolento.mp3"></audio>
  <audio id="medium-steps-audio" preload="auto" src="assets/sounds/passomedio.mp3"></audio>
  <audio id="fast-steps-audio" preload="auto" src="assets/sounds/passorapido.mp3"></audio>
  <audio id="very-fast-steps-audio" preload="auto" src="assets/sounds/passomuitorapido.mp3"></audio>
  <audio id="key-collected-audio" preload="auto" src="assets/sounds/chavecoletada.mp3"></audio>
  <audio id="drawer-open-audio" preload="auto" src="assets/sounds/gavetaabrindo.mp3"></audio>
  <audio id="phone-collected-audio" preload="auto" src="assets/sounds/celularcoletado.mp3"></audio>
  <audio id="jumpscare-audio" preload="auto" src="assets/sounds/somjumpscare.mp3"></audio>

  <script src="game.js"></script>
</body>
</html>
